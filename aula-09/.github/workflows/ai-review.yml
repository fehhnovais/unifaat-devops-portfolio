# ──────────────────────────────────────────────────────────────
# CÓPIA DE REFERÊNCIA (documental) do workflow de AI Review.
# O workflow que REALMENTE roda fica na raiz do repositório:
#   .github/workflows/ai-review-aula09.yml
# O GitHub não executa workflows em subpastas como aula-09/.
# ──────────────────────────────────────────────────────────────
name: AI Review Aula 09

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - 'aula-09/**'
      - '.github/workflows/ai-review-aula09.yml'

concurrency:
  group: ai-review-aula09-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write

jobs:
  ai-review:
    name: AI Review + Quality Gate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do código
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Gerar diff do PR (apenas aula-09)
        run: |
          git diff "origin/${{ github.base_ref }}...HEAD" -- 'aula-09/**' > pr.diff || true
      - name: Rodar análise de IA (gera comentário + quality gate)
        id: review
        continue-on-error: true
        run: node aula-09/.github/scripts/ai-review.js pr.diff
      - name: Postar/atualizar comentário no PR
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs = require('fs');
            let body = '## 🤖 AI Review — TechNova\n\n(sem saída da análise)';
            try { body = fs.readFileSync('ai-review-comment.md', 'utf8'); } catch (e) {}
            const marker = '<!-- ai-review-aula09 -->';
            body = marker + '\n' + body;
            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;
            const comments = await github.rest.issues.listComments({ owner, repo, issue_number });
            const existing = comments.data.find(c => c.body && c.body.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number, body });
            }
      - name: Aplicar quality gate (falha se houver CRITICAL)
        if: steps.review.outcome == 'failure'
        run: |
          echo "Quality gate bloqueou o PR: há achados CRITICAL."
          exit 1
